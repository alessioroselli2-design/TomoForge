name: MPMM wrong-neighbor verified source corrections
on:
  push:
    branches:
      - 'audit/mpmm-three-neighbor-stats-*'
    paths:
      - .github/workflows/mpmm-three-neighbor-stats-review.yml
      - backend/services/mpmm_three_wrong_neighbours_source_review.py
      - backend/tests/test_mpmm_three_wrong_neighbours_source_review.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-no-write-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Audit three already verified records against wrong-neighbor source evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()/"backend"))
          from core.db import db
          from services.mpmm_three_wrong_neighbours_source_review import TARGETS,audit_wrong_neighbor

          async def audit():
              if not db.configured:
                  raise RuntimeError("db_connection_not_available")
              decisions=[]
              for name,spec in TARGETS.items():
                  before=await db.private_reference_records.find_one({"id":spec["id"]})
                  verdict=audit_wrong_neighbor(name,before)
                  after=await db.private_reference_records.find_one({"id":spec["id"]})
                  if before!=after:
                      raise RuntimeError("record_changed_during_readonly_audit")
                  verdict["snapshot_unchanged"]=True
                  decisions.append(verdict)
              return decisions

          print("MPMM_THREE_WRONG_NEIGHBOUR_FINAL_REPORT")
          print(json.dumps(asyncio.run(audit()),sort_keys=True))
          PY
