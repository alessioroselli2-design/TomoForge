name: Source-guided Player's Handbook 31 resume

on:
  push:
    branches:
      - run/phb31-resume
    paths:
      - .github/source-guided-phb31-resume-request.txt

permissions:
  contents: read

concurrency:
  group: tomoforge-source-guided-phb31-resume
  cancel-in-progress: false

jobs:
  phb31-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tomoforge-manuals

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install OCR and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt boto3

      - name: Resume sealed Player's Handbook 31 repair
        run: |
          set -o pipefail
          python backend/scripts/repair_monsters_from_source.py \
            --target-set batch_players_handbook \
            --allow-r2-download \
            --execute \
            --confirm "CLEAN-PHB31-31-a2f4c03bff9e13e4834344e890cdf099" \
            | tee /tmp/phb31-source-guided-resume.log

      - name: Assert exact resume completion
        run: |
          grep -q '"dry_run": false' /tmp/phb31-source-guided-resume.log
          grep -q '"targets": 31' /tmp/phb31-source-guided-resume.log
          grep -q '"repairable": 31' /tmp/phb31-source-guided-resume.log
          grep -q '"blocked": 0' /tmp/phb31-source-guided-resume.log
          grep -q '"updates_performed": 17' /tmp/phb31-source-guided-resume.log
          grep -q '"players_handbook_already_applied": 14' /tmp/phb31-source-guided-resume.log

      - name: Upload resume output
        uses: actions/upload-artifact@v4
        with:
          name: phb31-source-guided-resume
          path: /tmp/phb31-source-guided-resume.log
          if-no-files-found: error
          retention-days: 3
