name: Full MPMM 1-100 53 dry-run

on:
  push:
    branches:
      - codex/mpmm-1-100-fixqueue-20260930
    paths:
      - backend/scripts/audit_mpmm_1_100.py
      - .github/workflows/mpmm-1-100-dry-run.yml

permissions:
  contents: read

concurrency:
  group: tomoforge-mpmm-1-100-53-dry-run
  cancel-in-progress: true

jobs:
  mpmm-1-100-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tomoforge-manuals

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install OCR and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt boto3

      - name: Run sealed MPMM 1-100 read-only audit
        run: |
          set -o pipefail
          python backend/scripts/audit_mpmm_1_100.py \
            --allow-r2-download \
            | tee /tmp/mpmm-1-100-dry-run.log

      - name: Assert read-only invariants
        run: |
          grep -q '"dry_run": true' /tmp/mpmm-1-100-dry-run.log
          grep -q '"targets": 53' /tmp/mpmm-1-100-dry-run.log
          grep -q '"updates_performed": 0' /tmp/mpmm-1-100-dry-run.log

      - name: Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: mpmm-1-100-FINAL_REPORT
          path: /tmp/mpmm-1-100-dry-run.log
          if-no-files-found: error
          retention-days: 3
