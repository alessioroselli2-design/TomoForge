name: Audit TomoForge R2 manuals

on:
  push:
    branches:
      - ai-canonical-library
    paths:
      - .github/r2-audit-request.txt

permissions:
  contents: read

concurrency:
  group: tomoforge-r2-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tomoforge-manuals
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install boto3
        run: python -m pip install boto3
      - name: Audit R2 PDFs
        run: python backend/scripts/audit_r2_manuals.py
