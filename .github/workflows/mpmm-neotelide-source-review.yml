name: MPMM Neotelide complete original source audit
on:
  push:
    branches:
      - 'audit/mpmm-neotelide-original-statblock-*'
    paths:
      - .github/workflows/mpmm-neotelide-source-review.yml
      - backend/services/mpmm_neotelide_source_review.py
      - backend/tests/test_mpmm_neotelide_source_review.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly-source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend
        run: python -m pip install -r backend/requirements.txt
      - name: Audit exact existing Neotelide source without writes
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()/"backend"))
          from core.db import db
          from services.mpmm_neotelide_source_review import ID,assess_neotelide

          async def audit():
              if not db.configured:
                  raise RuntimeError("database_unavailable")
              before=await db.private_reference_records.find_one({"id":ID})
              verdict=assess_neotelide(before)
              after=await db.private_reference_records.find_one({"id":ID})
              if before!=after:
                  raise RuntimeError("source_mutated_during_readonly_review")
              verdict["snapshot_unchanged"]=True
              return verdict

          print("MPMM_NEOTELIDE_FINAL_REPORT")
          print(json.dumps(asyncio.run(audit()),sort_keys=True))
          PY
