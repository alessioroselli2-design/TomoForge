name: Three-monster source-guided dry-run batch 1

on:
  push:
    branches:
      - develop
    paths:
      - .github/three-monster-dry-run-batch-1-request.txt

permissions:
  contents: read

jobs:
  dry-run:
    name: dry-run (${{ matrix.slot }}) ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slot: "03"
            name: "Bael"
          - slot: "04"
            name: "Cerato Po"
          - slot: "06"
            name: "Congreghe Di Megere"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tesseract OCR and Italian data
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          python -m pip install boto3
      - name: Run one target read-only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -o pipefail
          python backend/scripts/repair_monsters_from_source.py --name "${{ matrix.name }}" --allow-r2-download | tee "/tmp/source-guided-${{ matrix.slot }}-dry-run.log"
          python - <<'PY'
          import json, pathlib
          slot = "${{ matrix.slot }}"
          log = pathlib.Path(f"/tmp/source-guided-{slot}-dry-run.log").read_text()
          marker = "FINAL_REPORT\n"
          if marker not in log:
              raise SystemExit("FINAL_REPORT missing")
          report = json.loads(log.rsplit(marker, 1)[1].strip().splitlines()[0])
          assert report["dry_run"] is True
          assert report["updates_performed"] == 0
          assert report["targets"] == 1
          pathlib.Path(f"/tmp/{slot}-FINAL_REPORT.json").write_text(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-monster-${{ matrix.slot }}-dry-run
          path: |
            /tmp/source-guided-${{ matrix.slot }}-dry-run.log
            /tmp/${{ matrix.slot }}-FINAL_REPORT.json
          if-no-files-found: warn
