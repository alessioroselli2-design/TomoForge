name: MPMM four original statblock read-only audit
on:
  push:
    branches:
      - 'audit/mpmm-four-encounter-statblocks-*'
    paths:
      - .github/workflows/mpmm-four-encounter-source-review.yml
      - backend/services/mpmm_four_encounter_source_review.py
      - backend/tests/test_mpmm_four_encounter_source_review.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-records-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend
        run: python -m pip install -r backend/requirements.txt
      - name: Audit four existing records without writing
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "backend"))
          from core.db import db
          from services.mpmm_four_encounter_source_review import TARGETS, assess_mpmm_existing_creature

          async def audit():
              if not db.configured:
                  raise RuntimeError("registered_source_db_unavailable")
              results = []
              for name, spec in TARGETS.items():
                  original = await db.private_reference_records.find_one({"id": spec["id"]})
                  status = assess_mpmm_existing_creature(name, original)
                  again = await db.private_reference_records.find_one({"id": spec["id"]})
                  if original != again:
                      raise RuntimeError("source_changed_while_auditing")
                  status["snapshot_unchanged"] = True
                  results.append(status)
              return results

          print("MPMM_FOUR_SOURCE_FINAL_REPORT")
          print(json.dumps(asyncio.run(audit()), sort_keys=True))
          PY
