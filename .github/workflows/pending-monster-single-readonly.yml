# Reusable read-only single-pending audit; request file is the sole target selector.
# No execute mode, no canonical writes, and no private OCR text is logged.
name: Pending monster single source OCR pilot

on:
  push:
    branches:
      - 'audit/pending-monster-*'
    paths:
      - .github/workflows/pending-monster-single-readonly.yml
      - .github/pending-monster-audit-request.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tomoforge-pending-monster-single-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  one-pending-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tomoforge-manuals

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Italian OCR and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita
          python -m pip install -r backend/requirements.txt boto3

      - name: Single pending source-guided audit - strictly read only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/pending-monster-single-FINAL_REPORT.json
          import argparse
          import asyncio
          from contextlib import redirect_stderr, redirect_stdout
          import io
          import json
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "backend"))
          from core.db import db
          from scripts import repair_monsters_from_source as repair
          from scripts.process_mpmm_pending import (
              _record_snapshot_sha256,
              _verified_proposal,
          )
          from services.monster_semantic_diagnostics import (
              deterministic_core_field_matches,
          )

          request = json.loads(
              Path(".github/pending-monster-audit-request.json").read_text(
                  encoding="utf-8"
              )
          )
          TARGET_ID = str(request["record_id"])
          TARGET_NAME = str(request["name"])
          SOURCE_ID = str(request["source_id"])
          TARGET_PAGE = int(request["page"])
          if not (
              re.fullmatch(r"ref_[0-9a-f]{32}", TARGET_ID)
              and re.fullmatch(r"[a-z][a-z0-9_]{2,79}", SOURCE_ID)
              and 1 <= TARGET_PAGE <= 2000
              and 1 <= len(TARGET_NAME) <= 120
              and all(ch not in TARGET_NAME for ch in "\r\n<>")
          ):
              raise RuntimeError("Malformed sealed audit request")

          async def audit():
              if not db.configured:
                  raise RuntimeError("Database not configured")
              collection = db.private_reference_records
              original = await collection.find_one({"id": TARGET_ID})
              if not isinstance(original, dict):
                  raise RuntimeError("Target missing")
              refs = original.get("source_refs") or []
              if not (
                  original.get("reference_type") == "monster"
                  and original.get("name") == TARGET_NAME
                  and original.get("review_status") == "pending"
                  and len(refs) == 1
                  and refs[0].get("logical_source_id") == SOURCE_ID
                  and refs[0].get("page") == TARGET_PAGE
                  and refs[0].get("source_status") == "active"
              ):
                  raise RuntimeError("Sealed source identity/status drift")
              before_sha = _record_snapshot_sha256(original)
              source_rows = await repair._fetch_all(
                  db.private_reference_sources, {"source_status": "active"}
              )
              args = argparse.Namespace(
                  execute=False,
                  target_set="bigby_single_pending_readonly",
                  pdf_root="",
                  allow_r2_download=True,
                  dpi=220,
                  languages="ita",
                  psm=6,
                  comparison_psm=4,
              )
              cache = repair.SourcePdfCache("", True)
              status = "blocked"
              reason = "unknown"
              attributes_unchanged = False
              changed_attribute_fields = []
              core_fields_unchanged = False
              deterministic_core_agreement = False
              deterministic_speed_agreement = False
              try:
                  # The private OCR/manual output stays only inside this worker.
                  with redirect_stdout(io.StringIO()), redirect_stderr(io.StringIO()):
                      try:
                          result = await repair._repair_one(
                              collection, original, source_rows, cache, args
                          )
                          proposal = _verified_proposal(result)
                          old_attributes = dict(original.get("attributes") or {})
                          new_attributes = dict(proposal.get("attributes") or {})
                          attributes_unchanged = new_attributes == old_attributes
                          raw_changed = sorted(
                              key for key in old_attributes.keys() | new_attributes.keys()
                              if old_attributes.get(key) != new_attributes.get(key)
                          )
                          changed_attribute_fields = [
                              key if re.fullmatch(r"[a-z][a-z0-9_]{0,49}", key)
                              else "other_field"
                              for key in raw_changed[:20]
                          ]
                          core_fields_unchanged = not bool(
                              set(raw_changed)
                              & {"classe_armatura", "punti_ferita", "velocita"}
                          )
                          matching = deterministic_core_field_matches(
                              old_attributes, new_attributes
                          )
                          deterministic_core_agreement = all(
                              matching.get(f"{field}_deterministic_match", False)
                              for field in ("classe_armatura", "punti_ferita", "velocita")
                          )
                          deterministic_speed_agreement = bool(
                              matching.get("velocita_deterministic_match", False)
                          )
                          if attributes_unchanged:
                              status = "repairable_status_only"
                              reason = "all_gates_pass"
                          elif (
                              old_attributes.keys() == new_attributes.keys()
                              and set(raw_changed).issubset(
                                  {"classe_armatura", "punti_ferita", "velocita"}
                              )
                              and deterministic_core_agreement
                          ):
                              status = "repairable_equivalent_core"
                              reason = "core_deterministic_equivalence"
                          else:
                              status = "review_required"
                              reason = "attribute_change_required"
                      except repair.RepairBlocked as exc:
                          candidate = str(exc.reason or "")
                          reason = (
                              candidate
                              if re.fullmatch(r"[a-z][a-z0-9_]{0,79}", candidate)
                              else "source_gate_blocked"
                          )
                      except Exception:
                          reason = "audit_exception"
              finally:
                  cache.close()
              current = await collection.find_one({"id": TARGET_ID})
              unchanged = (
                  isinstance(current, dict)
                  and _record_snapshot_sha256(current) == before_sha
              )
              if not unchanged:
                  raise RuntimeError("Read-only record snapshot drift detected")
              return {
                  "target": TARGET_NAME,
                  "record_id": TARGET_ID,
                  "source_id": SOURCE_ID,
                  "source_page": TARGET_PAGE,
                  "dry_run": True,
                  "updates_performed": 0,
                  "status": status,
                  "reason": reason,
                  "attributes_unchanged": attributes_unchanged,
                  "changed_attribute_fields": changed_attribute_fields,
                  "core_fields_unchanged": core_fields_unchanged,
                  "deterministic_core_agreement": deterministic_core_agreement,
                  "deterministic_speed_agreement": deterministic_speed_agreement,
                  "record_snapshot_unchanged": unchanged,
              }

          try:
              result = asyncio.run(audit())
          except Exception:
              result = {
                  "target": TARGET_NAME,
                  "dry_run": True,
                  "updates_performed": 0,
                  "status": "blocked",
                  "reason": "audit_preflight_or_snapshot_failure",
              }
          print("FINAL_REPORT")
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          PY

      - name: Publish safe single-record report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pending-monster-single-FINAL_REPORT
          path: /tmp/pending-monster-single-FINAL_REPORT.json
          if-no-files-found: warn
          retention-days: 7
