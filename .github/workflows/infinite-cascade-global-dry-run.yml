name: Infinite cascade global monster dry-run

on:
  push:
    branches:
      - tmp-infinite-cascade-global-dry-run
    paths:
      - .github/workflows/infinite-cascade-global-dry-run.yml

permissions:
  contents: read

concurrency:
  group: tomoforge-infinite-cascade-global-dry-run
  cancel-in-progress: false

jobs:
  global-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tomoforge-manuals

    steps:
      - name: Checkout exact merged develop revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install OCR and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt boto3

      - name: Run global read-only repair
        run: |
          set -o pipefail
          python backend/scripts/repair_monsters_from_source.py \
            --all \
            --allow-r2-download \
            | tee /tmp/infinite-cascade-global-dry-run.log

      - name: Validate read-only final report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lines = Path("/tmp/infinite-cascade-global-dry-run.log").read_text(encoding="utf-8").splitlines()
          marker = len(lines) - 1 - lines[::-1].index("FINAL_REPORT")
          report = json.loads(lines[marker + 1])
          assert report["dry_run"] is True
          assert report["updates_performed"] == 0
          Path("/tmp/infinite-cascade-global-final.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload complete report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infinite-cascade-global-dry-run
          path: |
            /tmp/infinite-cascade-global-dry-run.log
            /tmp/infinite-cascade-global-final.json
          if-no-files-found: warn
          retention-days: 3
