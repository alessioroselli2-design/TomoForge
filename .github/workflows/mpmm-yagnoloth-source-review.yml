name: MPMM Yagnoloth source-only read-only audit
on:
  push:
    branches:
      - 'audit/mpmm-yagnoloth-original-source-*'
    paths:
      - .github/workflows/mpmm-yagnoloth-source-review.yml
      - backend/services/mpmm_yagnoloth_source_review.py
      - backend/tests/test_mpmm_yagnoloth_source_review.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly-original-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Audit exact Yagnoloth original source and no writes
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()/"backend"))
          from core.db import db
          from services.mpmm_yagnoloth_source_review import ID,OWNER,SOURCE,NAME,review_yagnoloth_source

          async def run():
              if not db.configured:
                  raise RuntimeError("database_unavailable")
              before=await db.private_reference_records.find_one({"id":ID})
              verdict=review_yagnoloth_source(before)
              duplicate=await db.private_reference_records.find_one({
                  "user_id":OWNER,"source_key":SOURCE,
                  "reference_type":"monster","normalized_name":NAME.casefold(),
              })
              if duplicate is not None:
                  raise RuntimeError("source_specific_duplicate_monster_exists")
              after=await db.private_reference_records.find_one({"id":ID})
              if before!=after:
                  raise RuntimeError("registered_source_mutated_during_review")
              verdict["snapshot_unchanged"]=True
              return verdict

          print("MPMM_YAGNOLOTH_FINAL_REPORT")
          print(json.dumps(asyncio.run(run()),sort_keys=True))
          PY
