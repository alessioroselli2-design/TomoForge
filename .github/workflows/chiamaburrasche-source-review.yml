name: Bigby Chiamaburrasche sealed source review
on:
  push:
    branches:
      - 'audit/chiamaburrasche-source-review-*'
    paths:
      - .github/workflows/chiamaburrasche-source-review.yml
      - backend/services/chiamaburrasche_source_review.py
      - backend/tests/test_chiamaburrasche_source_review.py
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  exact-record-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Exact-source immutable record and numeric gate audit
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "backend"))
          from core.db import db
          from services.chiamaburrasche_source_review import (
              RECORD_ID,
              assess_chiamaburrasche_registered_source,
          )

          async def audit():
              if not db.configured:
                  raise RuntimeError("registered_source_database_unavailable")
              first = await db.private_reference_records.find_one({"id": RECORD_ID})
              outcome = assess_chiamaburrasche_registered_source(first)
              last = await db.private_reference_records.find_one({"id": RECORD_ID})
              if first != last:
                  raise RuntimeError("registered_snapshot_changed")
              return {
                  "status": outcome["status"],
                  "source_id": outcome["source_id"],
                  "registered_pages": outcome["registered_pages"],
                  "numeric_gates_passed": outcome["numeric_gates_passed"],
                  "attributes_unchanged": outcome["attributes_unchanged"],
                  "raw_dice_text_preserved": outcome["raw_dice_text_preserved"],
                  "snapshot_unchanged": True,
                  "writes": 0,
              }

          print("CHIAMABURRASCHE_SOURCE_FINAL_REPORT")
          print(json.dumps(asyncio.run(audit()), sort_keys=True))
          PY
      - name: Post privacy-safe verdict
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body "Chiamaburrasche exact Bigby IT p154 source-only review passed: English Storm Giant Tempest Caller original AC17, HP310 (27d12+135), speed50ft/fly/swim (15m) corroborated, raw Italian OCR split digits preserved, no data writes. CI+Vercel and separate guarded DB review required."
          fi
