name: Audit four failed-gate monsters

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tomoforge-manuals

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install OCR and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt boto3

      - name: Run read-only four-target OCR audit
        run: |
          set -o pipefail
          python backend/scripts/audit_failed_gate_monsters.py \
            --allow-r2-download \
            | tee /tmp/four-failed-gate-audit.log

      - name: Assert no write path
        run: |
          grep -q '"writes_performed": 0' /tmp/four-failed-gate-audit.log
          grep -q '"targets": 4' /tmp/four-failed-gate-audit.log

      - name: Upload audit output
        uses: actions/upload-artifact@v4
        with:
          name: four-failed-gate-ocr-audit
          path: /tmp/four-failed-gate-audit.log
          if-no-files-found: error
          retention-days: 3
