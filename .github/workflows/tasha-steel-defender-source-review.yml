# Sealed original Tasha record review; never writes production data.
name: Tasha Steel Defender sealed source review
on:
  push:
    branches:
      - 'audit/tasha-steel-defender-source-*'
    paths:
      - .github/workflows/tasha-steel-defender-source-review.yml
      - backend/services/tasha_steel_defender_source_review.py
      - backend/tests/test_tasha_steel_defender_source_review.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tasha-exact-record-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend pinned dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Confirm original exact source snapshot without writes
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "backend"))
          from core.db import db
          from services.tasha_steel_defender_source_review import (
              RECORD_ID, assess_tasha_steel_defender_source,
          )

          async def audit():
              if not db.configured:
                  raise RuntimeError("source_db_unavailable")
              before = await db.private_reference_records.find_one({"id": RECORD_ID})
              report = assess_tasha_steel_defender_source(before)
              after = await db.private_reference_records.find_one({"id": RECORD_ID})
              if before != after:
                  raise RuntimeError("registered_source_snapshot_changed_during_audit")
              report["snapshot_unchanged"] = True
              return report

          print("TASHA_SOURCE_REVIEW_REPORT")
          print(json.dumps(asyncio.run(audit()), sort_keys=True))
          PY
