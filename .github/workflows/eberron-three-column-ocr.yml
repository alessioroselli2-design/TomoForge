name: Eberron unresolved three column OCR

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/eberron-three-column-ocr.yml
      - backend/scripts/eberron_three_column_ocr.py

permissions:
  contents: read

concurrency:
  group: tomoforge-eberron-three-column-ocr
  cancel-in-progress: false

jobs:
  read-only-source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tomoforge-manuals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline OCR tooling
        run: |
          python -m pip install -r backend/requirements.txt boto3 PyMuPDF
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita
      - name: Compare source page 41, 43 and 51 using independent column OCR
        run: python backend/scripts/eberron_three_column_ocr.py --output /tmp/eberron-column-evidence.json
      - name: Preserve only factual metadata - no original page text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eberron-three-column-metadata-only
          path: /tmp/eberron-column-evidence.json
          if-no-files-found: warn
          retention-days: 3
