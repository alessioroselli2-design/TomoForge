name: Tasha Young Mimic original-page source review
on:
  push:
    branches:
      - 'audit/tasha-all-creature-statblocks-*'
    paths:
      - .github/workflows/tasha-young-mimic-source-review.yml
      - backend/services/tasha_young_mimic_source_review.py
      - backend/tests/test_tasha_young_mimic_source_review.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Live licensed source plus exact-name anti-duplicate check, no writes
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "backend"))
          from core.db import db
          from services.tasha_young_mimic_source_review import (
              ID, NAME, SOURCE_ID, audit_young_mimic,
          )

          async def check():
              if not db.configured:
                  raise RuntimeError("source_database_unavailable")
              source = await db.private_reference_sources.find_one({
                  "logical_source_id": SOURCE_ID,
              })
              row = await db.private_reference_records.find_one({"id": ID})
              other = await db.private_reference_records.find_one({
                  "user_id": "user_fabf28726a20",
                  "normalized_name": NAME.casefold(),
              })
              result = audit_young_mimic(
                  row, [other] if other is not None else [], source
              )
              again = await db.private_reference_records.find_one({"id": ID})
              named_again = await db.private_reference_records.find_one({
                  "user_id": "user_fabf28726a20",
                  "normalized_name": NAME.casefold(),
              })
              if again is not None or named_again is not None:
                  raise RuntimeError("candidate_created_during_read_only_check")
              result["snapshot_unchanged"] = True
              return result

          print("TASHA_YOUNG_MIMIC_SOURCE_FINAL_REPORT")
          print(json.dumps(asyncio.run(check()), sort_keys=True))
          PY
