name: MPMM four source-locked named-statblocks
on:
  push:
    branches:
      - 'audit/mpmm-four-giant-venator-yagnoloth-*'
    paths:
      - .github/workflows/mpmm-four-named-statblocks.yml
      - backend/services/mpmm_four_named_statblocks_review.py
      - backend/tests/test_mpmm_four_named_statblocks_review.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend
        run: python -m pip install -r backend/requirements.txt
      - name: Source-specific live read-only preflight, zero writes
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()/"backend"))
          from core.db import db
          from services.mpmm_four_named_statblocks_review import (
              TARGETS,OWNER,FILE,validate_record,
          )

          async def audit():
              if not db.configured:
                  raise RuntimeError("original_db_unavailable")
              results=[]
              for name,spec in TARGETS.items():
                  before=await db.private_reference_records.find_one({"id":spec["id"]})
                  outcome=validate_record(name,before)
                  collision=await db.private_reference_records.find_one({
                      "user_id":OWNER,"source_key":FILE,
                      "reference_type":"monster","normalized_name":name.casefold(),
                  })
                  if collision is not None:
                      raise RuntimeError("duplicate_monster_already_present")
                  after=await db.private_reference_records.find_one({"id":spec["id"]})
                  if before!=after:
                      raise RuntimeError("original_source_changed_during_audit")
                  outcome["source_snapshot_unchanged"]=True
                  results.append(outcome)
              return results

          print("MPMM_FOUR_NAMED_SOURCE_FINAL_REPORT")
          print(json.dumps(asyncio.run(audit()),sort_keys=True))
          PY
