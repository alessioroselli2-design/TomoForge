name: Legacy racial source evidence

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/legacy-races-r2-audit.yml
      - backend/scripts/legacy_races_r2_audit.py

permissions:
  contents: read

jobs:
  legacy-source-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tomoforge-manuals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF and local OCR tools
        run: |
          python -m pip install -r backend/requirements.txt boto3 PyMuPDF
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Source-limited read-only audit of legacy racial options
        run: python backend/scripts/legacy_races_r2_audit.py --output /tmp/legacy-races-report.json
      - name: Upload non-sensitive metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-races-metadata-only
          path: /tmp/legacy-races-report.json
          retention-days: 3
          if-no-files-found: warn
