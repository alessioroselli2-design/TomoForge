name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — Ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Ruff format check
        run: uv run ruff format --check backend

      - name: Ruff lint
        run: uv run ruff check backend

      - name: Run backend test suite
        working-directory: backend
        run: uv run pytest

  frontend:
    name: Frontend — test + production build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install Yarn 1.22.22
        run: npm install --global yarn@1.22.22

      - name: Install frontend dependencies from lockfile
        run: yarn install --frozen-lockfile

      - name: Run frontend tests
        env:
          CI: "true"
        run: yarn test --watchAll=false --passWithNoTests

      - name: Static checks and production build
        env:
          CI: "true"
        run: yarn build
