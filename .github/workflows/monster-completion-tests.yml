name: Monster completion safety tests

on:
  pull_request:
    paths:
      - 'backend/monster_completion_*.py'
      - 'backend/translation_integrity.py'
      - 'tests/test_monster_completion_*.py'
      - '.github/workflows/monster-completion-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile pilot modules
        run: python -m compileall -q backend/monster_completion_preflight.py backend/monster_completion_dry_run.py backend/monster_completion_proposal.py backend/monster_completion_atomic_sql.py
      - name: Run isolated unit tests
        run: python -m unittest discover -s tests -p 'test_monster_completion_*.py' -v
