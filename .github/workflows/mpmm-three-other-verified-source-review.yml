name: MPMM three misclassified verified other source audit
on:
  push:
    branches:
      - 'audit/mpmm-three-other-verified-statblocks-*'
    paths:
      - .github/workflows/mpmm-three-other-verified-source-review.yml
      - backend/services/mpmm_three_other_verified_source_review.py
      - backend/tests/test_mpmm_three_other_verified_source_review.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-original-read-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Check three historically other/verified records without writes
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0,str(Path.cwd()/"backend"))
          from core.db import db
          from services.mpmm_three_other_verified_source_review import (
              TARGETS,OWNER,SOURCE,review_existing_creature,
          )

          async def audit():
              if not db.configured:
                  raise RuntimeError("source_database_unavailable")
              reports=[]
              for name,spec in TARGETS.items():
                  before=await db.private_reference_records.find_one({"id":spec["id"]})
                  verdict=review_existing_creature(name,before)
                  dup=await db.private_reference_records.find_one({
                      "user_id":OWNER,"source_key":SOURCE,
                      "reference_type":"monster","normalized_name":name.casefold(),
                  })
                  if dup is not None:
                      raise RuntimeError("same_book_monster_duplicate")
                  after=await db.private_reference_records.find_one({"id":spec["id"]})
                  if before!=after:
                      raise RuntimeError("original_source_changed_during_audit")
                  verdict["snapshot_unchanged"]=True
                  reports.append(verdict)
              return reports

          print("MPMM_THREE_OTHER_VERIFIED_FINAL_REPORT")
          print(json.dumps(asyncio.run(audit()),sort_keys=True))
          PY
