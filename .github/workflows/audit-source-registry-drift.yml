name: Audit source registry drift

on:
  push:
    branches:
      - ai-canonical-library
    paths:
      - .github/source-registry-drift-audit-request.txt

permissions:
  contents: read

jobs:
  audit-source-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Compare versioned registry with Supabase catalogue
        run: python backend/scripts/audit_source_registry_drift.py
