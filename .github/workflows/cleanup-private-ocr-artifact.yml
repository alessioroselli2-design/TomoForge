name: Cleanup private OCR artifact

on:
  push:
    branches:
      - ai-canonical-library
    paths:
      - .github/cleanup-private-ocr-artifact-request.txt

permissions:
  actions: write
  contents: read

jobs:
  cleanup-private-ocr-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_ID: "9924592142"
    steps:
      - name: Delete obsolete OCR-text artifact
        run: |
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
          echo "Deleted artifact ${ARTIFACT_ID}"
