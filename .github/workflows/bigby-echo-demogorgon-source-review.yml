name: Bigby Eco di Demogorgon exact source audit
on:
  push:
    branches:
      - 'audit/bigby-echo-demogorgon-reclass-*'
    paths:
      - .github/workflows/bigby-echo-demogorgon-source-review.yml
      - backend/services/echo_demogorgon_reclass_review.py
      - backend/tests/test_echo_demogorgon_reclass_review.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  single-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Validate registered source without database writes
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "backend"))
          from core.db import db
          from services.echo_demogorgon_reclass_review import (
              RECORD_ID, assess_existing_echo_record,
          )

          async def audit():
              if not db.configured:
                  raise RuntimeError("source_database_unavailable")
              before = await db.private_reference_records.find_one({"id": RECORD_ID})
              result = assess_existing_echo_record(before)
              after = await db.private_reference_records.find_one({"id": RECORD_ID})
              if before != after:
                  raise RuntimeError("source_snapshot_changed_during_readonly_audit")
              result["snapshot_unchanged"] = True
              return result

          print("ECHO_DEMOGORGON_FINAL_REPORT")
          print(json.dumps(asyncio.run(audit()), sort_keys=True))
          PY
