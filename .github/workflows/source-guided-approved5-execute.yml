name: Source-guided approved5 execute

on:
  push:
    branches:
      - develop
    paths:
      - .github/source-guided-approved5-execute-request.txt

permissions:
  contents: read

concurrency:
  group: tomoforge-source-guided-approved5-execute
  cancel-in-progress: false

jobs:
  approved5-execute:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tomoforge-manuals

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install OCR and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt boto3

      - name: Execute sealed approved5 repair
        run: |
          set -o pipefail
          python backend/scripts/repair_monsters_from_source.py \
            --target-set approved5 \
            --allow-r2-download \
            --execute \
            --confirm "REPAIR-APPROVED5-5-413b398ac7e0c55dcd3b61eed14b66ef" \
            | tee /tmp/approved5-source-guided-execute.log

      - name: Assert exact batch completion
        run: |
          grep -q '"targets": 5' /tmp/approved5-source-guided-execute.log
          grep -q '"repairable": 5' /tmp/approved5-source-guided-execute.log
          grep -q '"blocked": 0' /tmp/approved5-source-guided-execute.log
          grep -q '"updates_performed": 5' /tmp/approved5-source-guided-execute.log
          grep -Eq '"batch_updated_at": "[0-9]{4}-[0-9]{2}-[0-9]{2}T[^\"]+Z"' \
            /tmp/approved5-source-guided-execute.log

      - name: Run post-execute global dry-run
        run: |
          set -o pipefail
          python backend/scripts/repair_monsters_from_source.py \
            --all \
            --allow-r2-download \
            | tee /tmp/approved5-post-execute-global-dry-run.log

      - name: Assert post-execute dry-run safety
        run: |
          grep -q '"dry_run": true' /tmp/approved5-post-execute-global-dry-run.log
          grep -q '"updates_performed": 0' /tmp/approved5-post-execute-global-dry-run.log

      - name: Upload execute output
        uses: actions/upload-artifact@v4
        with:
          name: approved5-source-guided-execute
          path: /tmp/approved5-source-guided-execute.log
          if-no-files-found: error
          retention-days: 3

      - name: Upload post-execute global dry-run output
        uses: actions/upload-artifact@v4
        with:
          name: approved5-post-execute-global-dry-run
          path: /tmp/approved5-post-execute-global-dry-run.log
          if-no-files-found: error
          retention-days: 3
