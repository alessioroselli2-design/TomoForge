name: Global source-guided monster dry-run

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/source-guided-global-dry-run.yml
      - .github/source-guided-global-dry-run-request.txt

permissions:
  contents: read

concurrency:
  group: tomoforge-source-guided-global-dry-run
  cancel-in-progress: true

jobs:
  granular-dry-run:
    name: granular-dry-run (${{ matrix.slot }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - slot: "01"
            name: "8Hadar-Kai Trafficante"
          - slot: "02"
            name: "Altisauro"
          - slot: "03"
            name: "Bael"
          - slot: "04"
            name: "Cerato Po"
          - slot: "05"
            name: "Colosso Runico"
          - slot: "06"
            name: "Congreghe Di Megere"
          - slot: "07"
            name: "Consigliere Imperituro"
          - slot: "08"
            name: "Difensore D'Acciaio"
          - slot: "09"
            name: "Dimetrodonte"
          - slot: "10"
            name: "Quetzalcoatlus"
          - slot: "11"
            name: "Fulmine Vivente"
          - slot: "12"
            name: "Granchio Delle Tempeste"
          - slot: "13"
            name: "Ippoaracne Maschio"
          - slot: "14"
            name: "Larvico"
          - slot: "15"
            name: "M Orfico"
          - slot: "16"
            name: "Molo Oh"
          - slot: "17"
            name: "Nube Mortale Vivente"
          - slot: "18"
            name: "Pelle Bestiale"
          - slot: "19"
            name: "Quori Hashalaq,"
          - slot: "20"
            name: "Rak Tulkhesh"
          - slot: "21"
            name: "Rampollo Delle Profondità"
          - slot: "22"
            name: "Rana"
          - slot: "23"
            name: "Ratto Cranico"
          - slot: "24"
            name: "Regi Sauro"
          - slot: "25"
            name: "Sciame Di Ratti Cranici"
          - slot: "26"
            name: "Spirito Della Fiamma"
          - slot: "27"
            name: "Straziato Re"
          - slot: "28"
            name: "Torre D'Assedio"
          - slot: "29"
            name: "Velociraptor"
          - slot: "30"
            name: "Yuan-Ti Portavoce Degli Incubi"
          - slot: "31"
            name: "Yuan-Ti Signore Della Fossa"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tomoforge-manuals

    steps:
      - name: Checkout dispatched revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install OCR and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt boto3

      - name: Run single-monster read-only source-guided repair
        run: |
          set -o pipefail
          python backend/scripts/repair_monsters_from_source.py \
            --name "${{ matrix.name }}" \
            --allow-r2-download \
            | tee "/tmp/source-guided-${{ matrix.slot }}-dry-run.log"

      - name: Extract and validate final report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          slot = "${{ matrix.slot }}"
          expected_name = """${{ matrix.name }}"""
          log_path = Path(f"/tmp/source-guided-{slot}-dry-run.log")
          lines = log_path.read_text(encoding="utf-8").splitlines()
          try:
              marker = len(lines) - 1 - lines[::-1].index("FINAL_REPORT")
              report = json.loads(lines[marker + 1])
          except (ValueError, IndexError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Missing or invalid FINAL_REPORT: {exc}") from exc

          if report.get("dry_run") is not True:
              raise SystemExit(f"{slot} repair did not run in dry-run mode")
          if report.get("updates_performed") != 0:
              raise SystemExit("Read-only invariant violated: updates were performed")
          if report.get("targets") != 1:
              raise SystemExit(f"{slot} expected exactly one target, got {report.get('targets')}")

          report["slot"] = slot
          report["expected_name"] = expected_name
          output = Path(f"/tmp/{slot}-FINAL_REPORT.json")
          output.write_text(
              json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload single-monster dry-run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-guided-${{ matrix.slot }}-dry-run
          path: |
            /tmp/source-guided-${{ matrix.slot }}-dry-run.log
            /tmp/${{ matrix.slot }}-FINAL_REPORT.json
          if-no-files-found: warn
          retention-days: 7

  aggregate-final-report:
    name: aggregate-final-report
    if: always()
    needs: granular-dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Download all granular reports
        uses: actions/download-artifact@v4
        with:
          pattern: source-guided-*-dry-run
          path: /tmp/granular
          merge-multiple: false

      - name: Build and validate FINAL_REPORT
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(Path("/tmp/granular").glob("**/*-FINAL_REPORT.json"))
          if len(paths) != 31:
              raise SystemExit(f"Expected 31 completed granular reports, found {len(paths)}")

          reports = [json.loads(path.read_text(encoding="utf-8")) for path in paths]
          if any(report.get("dry_run") is not True for report in reports):
              raise SystemExit("At least one granular report is not a dry run")
          if any(report.get("updates_performed") != 0 for report in reports):
              raise SystemExit("Read-only invariant violated in at least one granular report")
          if any(report.get("targets") != 1 for report in reports):
              raise SystemExit("At least one granular report does not contain exactly one target")

          repairable_records = []
          blocked_records = []
          for report in reports:
              repairable_records.extend(report.get("reports", []))
              blocked_records.extend(report.get("blocked_records", []))

          final = {
              "dry_run": True,
              "targets": 31,
              "repairable": len(repairable_records),
              "blocked": len(blocked_records),
              "updates_performed": 0,
              "repairable_names": [
                  item.get("name") or item.get("record_name")
                  for item in repairable_records
              ],
              "reports": repairable_records,
              "blocked_records": blocked_records,
          }
          if final["repairable"] + final["blocked"] != 31:
              raise SystemExit(
                  "Aggregate invariant violated: repairable + blocked must equal 31"
              )

          out = Path("/tmp/FINAL_REPORT.json")
          out.write_text(
              json.dumps(final, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("FINAL_REPORT")
          print(json.dumps(final, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload final aggregate report
        uses: actions/upload-artifact@v4
        with:
          name: source-guided-global-FINAL_REPORT
          path: /tmp/FINAL_REPORT.json
          if-no-files-found: error
          retention-days: 7
