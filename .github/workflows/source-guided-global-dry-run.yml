name: Focused Player's Handbook blocked8 dry-run

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
    paths:
      - backend/scripts/repair_monsters_from_source.py
      - .github/workflows/source-guided-global-dry-run.yml
      - .github/source-guided-global-dry-run-request.txt
  push:
    branches:
      - develop
    paths:
      - backend/scripts/repair_monsters_from_source.py
      - .github/workflows/source-guided-global-dry-run.yml
      - .github/source-guided-global-dry-run-request.txt

permissions:
  contents: read

concurrency:
  group: tomoforge-source-guided-players-handbook-dry-run
  cancel-in-progress: true

jobs:
  focused-dry-run:
    name: players-handbook-blocked8-read-only
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tomoforge-manuals

    steps:
      - name: Checkout dispatched revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install OCR and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt boto3

      - name: Run focused Player's Handbook read-only source-guided repair
        run: |
          set -o pipefail
          python backend/scripts/repair_monsters_from_source.py \
            --target-set batch_players_handbook_blocked8 \
            --allow-r2-download \
            | tee /tmp/players-handbook-dry-run.log

      - name: Extract and validate final report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          log_path = Path('/tmp/players-handbook-dry-run.log')
          lines = log_path.read_text(encoding='utf-8').splitlines()
          try:
              marker = len(lines) - 1 - lines[::-1].index('FINAL_REPORT')
              report = json.loads(lines[marker + 1])
          except (ValueError, IndexError, json.JSONDecodeError) as exc:
              raise SystemExit(f'Missing or invalid FINAL_REPORT: {exc}') from exc

          if report.get('dry_run') is not True:
              raise SystemExit('Focused PHB job did not run in dry-run mode')
          if report.get('updates_performed') != 0:
              raise SystemExit('Read-only invariant violated: updates were performed')
          if report.get('targets') != 8:
              raise SystemExit(f"Expected 8 targets, got {report.get('targets')}")
          if report.get('repairable', 0) + report.get('blocked', 0) != 8:
              raise SystemExit('Aggregate invariant violated: repairable + blocked must equal 8')

          out = Path('/tmp/FINAL_REPORT.json')
          out.write_text(
              json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print('FINAL_REPORT')
          print(json.dumps(report, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload focused dry-run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: players-handbook-blocked8-FINAL_REPORT
          path: |
            /tmp/players-handbook-dry-run.log
            /tmp/FINAL_REPORT.json
          if-no-files-found: warn
          retention-days: 7
