name: Global source-guided monster dry-run

on:
  # GitHub only exposes workflow_dispatch for workflows present on the default
  # branch. The canonical library lives on a separate branch, so use a sealed
  # request file to make the dry-run launchable there as well.
  push:
    branches:
      - ai-canonical-library
    paths:
      - .github/source-guided-global-dry-run-request.txt
      - .github/workflows/source-guided-global-dry-run.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tomoforge-source-guided-global-dry-run
  cancel-in-progress: false

jobs:
  global-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tomoforge-manuals

    steps:
      - name: Checkout dispatched revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install OCR and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt boto3

      - name: Run global read-only source-guided repair
        run: |
          set -o pipefail
          python backend/scripts/repair_monsters_from_source.py \
            --all \
            --allow-r2-download \
            | tee /tmp/source-guided-global-dry-run.log

      - name: Extract and validate final report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          log_path = Path("/tmp/source-guided-global-dry-run.log")
          lines = log_path.read_text(encoding="utf-8").splitlines()
          try:
              marker = len(lines) - 1 - lines[::-1].index("FINAL_REPORT")
              report = json.loads(lines[marker + 1])
          except (ValueError, IndexError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Missing or invalid FINAL_REPORT: {exc}") from exc

          if report.get("dry_run") is not True:
              raise SystemExit("Global repair did not run in dry-run mode")
          if report.get("updates_performed") != 0:
              raise SystemExit("Read-only invariant violated: updates were performed")

          output = Path("/tmp/source-guided-global-final-report.json")
          output.write_text(
              json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(output.read_text(encoding="utf-8"))
          PY

      - name: Upload complete dry-run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-guided-global-dry-run
          path: |
            /tmp/source-guided-global-dry-run.log
            /tmp/source-guided-global-final-report.json
          if-no-files-found: warn
          retention-days: 7
