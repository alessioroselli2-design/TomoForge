name: MPMM seven sealed original encounter sources
on:
  push:
    branches:
      - 'audit/mpmm-seven-encounters-census-*'
    paths:
      - .github/workflows/mpmm-seven-encounter-source-audit.yml
      - backend/services/mpmm_seven_encounter_source_review.py
      - backend/tests/test_mpmm_seven_encounter_source_review.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-registered-source-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend
        run: python -m pip install -r backend/requirements.txt
      - name: Audit only seven exact original records, no writes
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "backend"))
          from core.db import db
          from services.mpmm_seven_encounter_source_review import TARGETS, review_existing_statblock

          async def audit():
              if not db.configured:
                  raise RuntimeError("database_unavailable")
              reports=[]
              for name,t in TARGETS.items():
                  record=await db.private_reference_records.find_one({"id":t["id"]})
                  verdict=review_existing_statblock(name,record)
                  second=await db.private_reference_records.find_one({"id":t["id"]})
                  if record!=second:
                      raise RuntimeError("source_drift_in_read_only_audit")
                  verdict["snapshot_unchanged"]=True
                  reports.append(verdict)
              return reports

          print("MPMM_SEVEN_SOURCE_FINAL_REPORT")
          print(json.dumps(asyncio.run(audit()),sort_keys=True))
          PY
