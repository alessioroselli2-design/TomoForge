name: Bigby19 source-guided dry-run

on:
  push:
    branches:
      - tmp-bigby19-dry-run
    paths:
      - .github/workflows/bigby19-source-guided-dry-run.yml

permissions:
  contents: read

jobs:
  bigby19-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tomoforge-manuals

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install OCR and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt boto3

      - name: Run Bigby19 dry-run
        run: |
          set -o pipefail
          python backend/scripts/repair_monsters_from_source.py \
            --target-set bigby19 \
            --allow-r2-download \
            | tee /tmp/bigby19-source-guided-dry-run.log

      - name: Assert read-only
        run: |
          grep -q '"dry_run": true' /tmp/bigby19-source-guided-dry-run.log
          grep -q '"targets": 19' /tmp/bigby19-source-guided-dry-run.log
          grep -q '"updates_performed": 0' /tmp/bigby19-source-guided-dry-run.log

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: bigby19-source-guided-dry-run
          path: /tmp/bigby19-source-guided-dry-run.log
          if-no-files-found: error
          retention-days: 3
