name: Pilot local OCR parser from R2

on:
  push:
    branches:
      - ai-canonical-library
    paths:
      - .github/local-ocr-parser-pilot-request.txt

permissions:
  contents: read

concurrency:
  group: tomoforge-local-ocr-parser-pilot
  cancel-in-progress: false

jobs:
  local-ocr-parser-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tomoforge-manuals

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install local OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita tesseract-ocr-eng
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt boto3

      - name: Dry-run Monstrous Compendium Vol. 4 Eldraine pages 34-60 in bounded windows
        run: |
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "701858566-RRN5YRR.pdf" \
            --start-page 34 \
            --page-count 9 \
            --languages eng \
            --source-language en \
            --output-dir /tmp/eldraine-pilot/window-34-42
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "701858566-RRN5YRR.pdf" \
            --start-page 43 \
            --page-count 9 \
            --languages eng \
            --source-language en \
            --output-dir /tmp/eldraine-pilot/window-43-51
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "701858566-RRN5YRR.pdf" \
            --start-page 52 \
            --page-count 9 \
            --languages eng \
            --source-language en \
            --output-dir /tmp/eldraine-pilot/window-52-60

      - name: Upload bounded parser reports
        uses: actions/upload-artifact@v4
        with:
          name: eldraine-pilot
          path: /tmp/eldraine-pilot/**/report.json
          if-no-files-found: error
          retention-days: 3
