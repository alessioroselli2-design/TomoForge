name: Pilot local OCR parser from R2

on:
  push:
    branches:
      - ai-canonical-library
    paths:
      - .github/local-ocr-parser-pilot-request.txt

permissions:
  contents: read

concurrency:
  group: tomoforge-local-ocr-parser-pilot
  cancel-in-progress: false

jobs:
  local-ocr-parser-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tomoforge-manuals

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install local OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita tesseract-ocr-eng
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt boto3

      - name: Dry-run Tortle Package pages 1-10
        run: |
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "368524312-The-Tortle-Package.pdf" \
            --start-page 1 \
            --page-count 10 \
            --languages eng \
            --source-language en \
            --output-dir /tmp/tortle-package-pilot/window-1

      - name: Dry-run Tortle Package pages 11-20
        run: |
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "368524312-The-Tortle-Package.pdf" \
            --start-page 11 \
            --page-count 10 \
            --languages eng \
            --source-language en \
            --output-dir /tmp/tortle-package-pilot/window-2

      - name: Dry-run Tortle Package pages 21-28
        run: |
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "368524312-The-Tortle-Package.pdf" \
            --start-page 21 \
            --page-count 8 \
            --languages eng \
            --source-language en \
            --output-dir /tmp/tortle-package-pilot/window-3

      - name: Combine bounded reports
        run: |
          python backend/scripts/combine_local_ocr_parser_reports.py \
            --report /tmp/tortle-package-pilot/window-1/report.json \
            --report /tmp/tortle-package-pilot/window-2/report.json \
            --report /tmp/tortle-package-pilot/window-3/report.json \
            --output /tmp/tortle-package-pilot/report.json

      - name: Upload aggregate parser report
        uses: actions/upload-artifact@v4
        with:
          name: tortle-package-pilot
          path: /tmp/tortle-package-pilot/report.json
          if-no-files-found: error
          retention-days: 3
