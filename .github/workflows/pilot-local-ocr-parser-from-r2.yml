name: Pilot local OCR parser from R2

on:
  push:
    branches:
      - ai-canonical-library
    paths:
      - .github/local-ocr-parser-pilot-request.txt

permissions:
  contents: read

concurrency:
  group: tomoforge-local-ocr-parser-pilot
  cancel-in-progress: false

jobs:
  local-ocr-parser-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tomoforge-manuals

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install local OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita tesseract-ocr-eng
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt boto3

      - name: Dry-run Light of Xaryxis pages 1-11
        run: |
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "647833920-D-D-5ªE-Light-of-Xaryxis.pdf" \
            --start-page 1 \
            --page-count 11 \
            --languages eng \
            --source-language en \
            --output-dir /tmp/light-of-xaryxis-pilot/window-1-11

      - name: Dry-run Light of Xaryxis pages 12-22
        run: |
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "647833920-D-D-5ªE-Light-of-Xaryxis.pdf" \
            --start-page 12 \
            --page-count 11 \
            --languages eng \
            --source-language en \
            --output-dir /tmp/light-of-xaryxis-pilot/window-12-22

      - name: Dry-run Light of Xaryxis pages 23-33
        run: |
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "647833920-D-D-5ªE-Light-of-Xaryxis.pdf" \
            --start-page 23 \
            --page-count 11 \
            --languages eng \
            --source-language en \
            --output-dir /tmp/light-of-xaryxis-pilot/window-23-33

      - name: Dry-run Light of Xaryxis pages 34-44
        run: |
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "647833920-D-D-5ªE-Light-of-Xaryxis.pdf" \
            --start-page 34 \
            --page-count 11 \
            --languages eng \
            --source-language en \
            --output-dir /tmp/light-of-xaryxis-pilot/window-34-44

      - name: Dry-run Light of Xaryxis pages 45-55
        run: |
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "647833920-D-D-5ªE-Light-of-Xaryxis.pdf" \
            --start-page 45 \
            --page-count 11 \
            --languages eng \
            --source-language en \
            --output-dir /tmp/light-of-xaryxis-pilot/window-45-55

      - name: Dry-run Light of Xaryxis pages 56-66
        run: |
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "647833920-D-D-5ªE-Light-of-Xaryxis.pdf" \
            --start-page 56 \
            --page-count 11 \
            --languages eng \
            --source-language en \
            --output-dir /tmp/light-of-xaryxis-pilot/window-56-66

      - name: Upload bounded parser reports
        uses: actions/upload-artifact@v4
        with:
          name: light-of-xaryxis-pilot
          path: /tmp/light-of-xaryxis-pilot/**/report.json
          if-no-files-found: error
          retention-days: 3
