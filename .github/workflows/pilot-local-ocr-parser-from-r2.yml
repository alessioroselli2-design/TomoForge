name: Pilot local OCR parser from R2

on:
  push:
    branches:
      - ai-canonical-library
    paths:
      - .github/local-ocr-parser-pilot-request.txt

permissions:
  contents: read

concurrency:
  group: tomoforge-local-ocr-parser-pilot
  cancel-in-progress: false

jobs:
  local-ocr-parser-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tomoforge-manuals

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install local OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita tesseract-ocr-eng
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt boto3

      - name: Dry-run Tasha pages 67-77
        run: |
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "Calderone-Omnicomprensivo-di-TASHA.pdf" \
            --start-page 67 \
            --page-count 11 \
            --languages ita \
            --source-language it \
            --output-dir /tmp/tasha-pilot/window-67-77

      - name: Dry-run Tasha pages 78-88
        run: |
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "Calderone-Omnicomprensivo-di-TASHA.pdf" \
            --start-page 78 \
            --page-count 11 \
            --languages ita \
            --source-language it \
            --output-dir /tmp/tasha-pilot/window-78-88

      - name: Dry-run Tasha pages 89-99
        run: |
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "Calderone-Omnicomprensivo-di-TASHA.pdf" \
            --start-page 89 \
            --page-count 11 \
            --languages ita \
            --source-language it \
            --output-dir /tmp/tasha-pilot/window-89-99

      - name: Dry-run Tasha pages 100-110
        run: |
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "Calderone-Omnicomprensivo-di-TASHA.pdf" \
            --start-page 100 \
            --page-count 11 \
            --languages ita \
            --source-language it \
            --output-dir /tmp/tasha-pilot/window-100-110

      - name: Dry-run Tasha pages 111-121
        run: |
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "Calderone-Omnicomprensivo-di-TASHA.pdf" \
            --start-page 111 \
            --page-count 11 \
            --languages ita \
            --source-language it \
            --output-dir /tmp/tasha-pilot/window-111-121

      - name: Dry-run Tasha pages 122-132
        run: |
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "Calderone-Omnicomprensivo-di-TASHA.pdf" \
            --start-page 122 \
            --page-count 11 \
            --languages ita \
            --source-language it \
            --output-dir /tmp/tasha-pilot/window-122-132

      - name: Upload bounded parser reports
        uses: actions/upload-artifact@v4
        with:
          name: tasha-pilot
          path: /tmp/tasha-pilot/**/report.json
          if-no-files-found: error
          retention-days: 3
