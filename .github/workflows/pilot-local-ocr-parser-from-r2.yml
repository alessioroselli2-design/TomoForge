name: Pilot local OCR parser from R2

on:
  push:
    branches:
      - ai-canonical-library
    paths:
      - .github/local-ocr-parser-pilot-request.txt

permissions:
  contents: read

concurrency:
  group: tomoforge-local-ocr-parser-pilot
  cancel-in-progress: false

jobs:
  local-ocr-parser-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tomoforge-manuals

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install local OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita tesseract-ocr-eng
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt boto3

      - name: Dry-run Tasha pages 133-143
        run: |
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "Calderone-Omnicomprensivo-di-TASHA.pdf" \
            --start-page 133 \
            --page-count 11 \
            --languages ita \
            --source-language it \
            --output-dir /tmp/tasha-pilot/window-133-143

      - name: Dry-run Tasha pages 144-154
        run: |
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "Calderone-Omnicomprensivo-di-TASHA.pdf" \
            --start-page 144 \
            --page-count 11 \
            --languages ita \
            --source-language it \
            --output-dir /tmp/tasha-pilot/window-144-154

      - name: Dry-run Tasha pages 155-165
        run: |
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "Calderone-Omnicomprensivo-di-TASHA.pdf" \
            --start-page 155 \
            --page-count 11 \
            --languages ita \
            --source-language it \
            --output-dir /tmp/tasha-pilot/window-155-165

      - name: Dry-run Tasha pages 166-176
        run: |
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "Calderone-Omnicomprensivo-di-TASHA.pdf" \
            --start-page 166 \
            --page-count 11 \
            --languages ita \
            --source-language it \
            --output-dir /tmp/tasha-pilot/window-166-176

      - name: Dry-run Tasha pages 177-187
        run: |
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "Calderone-Omnicomprensivo-di-TASHA.pdf" \
            --start-page 177 \
            --page-count 11 \
            --languages ita \
            --source-language it \
            --output-dir /tmp/tasha-pilot/window-177-187

      - name: Dry-run Tasha pages 188-198
        run: |
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "Calderone-Omnicomprensivo-di-TASHA.pdf" \
            --start-page 188 \
            --page-count 11 \
            --languages ita \
            --source-language it \
            --output-dir /tmp/tasha-pilot/window-188-198

      - name: Upload bounded parser reports
        uses: actions/upload-artifact@v4
        with:
          name: tasha-pilot
          path: /tmp/tasha-pilot/**/report.json
          if-no-files-found: error
          retention-days: 3
