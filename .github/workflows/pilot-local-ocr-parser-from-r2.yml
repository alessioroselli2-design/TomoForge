name: Pilot local OCR parser from R2

on:
  push:
    branches:
      - ai-canonical-library
    paths:
      - .github/local-ocr-parser-pilot-request.txt

permissions:
  contents: read

concurrency:
  group: tomoforge-local-ocr-parser-pilot
  cancel-in-progress: false

jobs:
  local-ocr-parser-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tomoforge-manuals

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install local OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita tesseract-ocr-eng
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt boto3

      - name: Dry-run Monster Manual parser on pages 12-23
        run: |
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "847921086-Manuale-Dei-Mostri-5e.pdf" \
            --start-page 12 \
            --page-count 12 \
            --output-dir /tmp/mm-local-ocr-parser-pilot/window-12-23

      - name: Dry-run Monster Manual parser on pages 24-35
        run: |
          python backend/scripts/pilot_local_ocr_parse_from_r2.py \
            --filename "847921086-Manuale-Dei-Mostri-5e.pdf" \
            --start-page 24 \
            --page-count 12 \
            --output-dir /tmp/mm-local-ocr-parser-pilot/window-24-35

      - name: Combine privacy-safe aggregate reports
        run: |
          python backend/scripts/combine_local_ocr_parser_reports.py \
            --report /tmp/mm-local-ocr-parser-pilot/window-12-23/report.json \
            --report /tmp/mm-local-ocr-parser-pilot/window-24-35/report.json \
            --output /tmp/mm-local-ocr-parser-pilot/report.json

      - name: Upload aggregate parser report
        uses: actions/upload-artifact@v4
        with:
          name: mm-local-ocr-parser-pilot
          path: /tmp/mm-local-ocr-parser-pilot/report.json
          if-no-files-found: error
          retention-days: 3
