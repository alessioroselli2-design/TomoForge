name: Bigby Lince Gigante source-only audit
on:
  push:
    branches:
      - 'audit/lince-source-review-*'
    paths:
      - .github/workflows/lince-source-review.yml
      - backend/services/lince_source_review.py
      - backend/tests/test_lince_source_review.py
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  exact-record-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify exact source and live immutable pending snapshot
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "backend"))
          from core.db import db
          from services.lince_source_review import (
              RECORD_ID,
              assess_lince_registered_source,
          )

          async def audit():
              if not db.configured:
                  raise RuntimeError("source_database_not_configured")
              first = await db.private_reference_records.find_one({"id": RECORD_ID})
              result = assess_lince_registered_source(first)
              second = await db.private_reference_records.find_one({"id": RECORD_ID})
              if first != second:
                  raise RuntimeError("registered_snapshot_changed")
              return {
                  "status": result["status"],
                  "source": result["source_id"],
                  "pages": result["registered_pages"],
                  "attributes_unchanged": result["original_attributes_unchanged"],
                  "numeric_gates_passed": result["numeric_gates_passed"],
                  "snapshot_unchanged": True,
                  "writes": 0,
                  "editorial_review_required": True,
              }

          print("SOURCE_REVIEW_FINAL_REPORT")
          print(json.dumps(asyncio.run(audit()), sort_keys=True))
          PY
      - name: Post privacy-safe verdict
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body "Lince Gigante Bigby Italian p167 registered-source review passed: original Italian CA14, HP22(4d8+4), walk9m/climb9m kept unchanged, exact source checksum and global math gates intact. English original confirms AC14 HP22 30ft/climb30ft. No database writes; status-only promotion requires separate guarded adjudication. Ordinary OCR PR #432 remains inconclusive."
          fi
