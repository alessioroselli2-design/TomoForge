name: Source-guided global branch dry-run

on:
  push:
    branches:
      - global-source-guided-dry-run-20260917
    paths:
      - .github/workflows/source-guided-global-dry-run-branch.yml

permissions:
  contents: read

concurrency:
  group: tomoforge-source-guided-global-branch-dry-run
  cancel-in-progress: false

jobs:
  global-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tomoforge-manuals

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install OCR and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt boto3

      - name: Run global source-guided dry-run
        run: |
          set -o pipefail
          python backend/scripts/repair_monsters_from_source.py \
            --all \
            --allow-r2-download \
            | tee /tmp/global-source-guided-dry-run.log

      - name: Upload global dry-run output
        uses: actions/upload-artifact@v4
        with:
          name: global-source-guided-dry-run
          path: /tmp/global-source-guided-dry-run.log
          if-no-files-found: error
          retention-days: 3
