name: Bigby Baphomet sealed registered-source review
on:
  push:
    branches:
      - 'audit/baphomet-sealed-review-*'
    paths:
      - .github/workflows/baphomet-source-review.yml
      - backend/services/baphomet_source_review.py
      - backend/tests/test_baphomet_source_review.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-record-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify exact registered source without writes
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / "backend"))
          from core.db import db
          from services.baphomet_source_review import (
              RECORD_ID, assess_baphomet_registered_source,
          )
          async def audit():
              if not db.configured:
                  raise RuntimeError("source_database_unavailable")
              first = await db.private_reference_records.find_one({"id": RECORD_ID})
              result = assess_baphomet_registered_source(first)
              last = await db.private_reference_records.find_one({"id": RECORD_ID})
              if first != last:
                  raise RuntimeError("concurrent_source_snapshot_changed")
              result["snapshot_unchanged"] = True
              return result
          print("BAPHOMET_SOURCE_FINAL_REPORT")
          print(json.dumps(asyncio.run(audit()), sort_keys=True))
          PY
