name: Backend tests

on:
  push:
    branches:
      - ai-canonical-library
      - 'codex/**'
  pull_request:
    branches:
      - ai-canonical-library
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        env:
          SESSION_SECRET: tomoforge-ci-session-secret-32-bytes
        run: cd backend && pytest -q

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Check whitespace errors
        run: git diff --check
