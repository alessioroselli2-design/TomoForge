name: Bigby five missing monster source audits
on:
  push:
    branches:
      - 'audit/bigby-five-statblocks-reclass-*'
    paths:
      - .github/workflows/bigby-five-source-review.yml
      - backend/services/bigby_five_source_reclass.py
      - backend/tests/test_bigby_five_source_reclass.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-snapshot-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Audit each of five existing registered sources, no writes
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "backend"))
          from core.db import db
          from services.bigby_five_source_reclass import (
              SPECS, assess_bigby_reclassification,
          )

          async def audit():
              if not db.configured:
                  raise RuntimeError("source_database_unavailable")
              reports = []
              for name, spec in SPECS.items():
                  original = await db.private_reference_records.find_one({"id": spec["id"]})
                  report = assess_bigby_reclassification(name, original)
                  again = await db.private_reference_records.find_one({"id": spec["id"]})
                  if original != again:
                      raise RuntimeError("source_drift_during_audit: " + name)
                  report["snapshot_unchanged"] = True
                  reports.append(report)
              return reports

          print("BIGBY_FIVE_SOURCE_FINAL_REPORT")
          print(json.dumps(asyncio.run(audit()), sort_keys=True))
          PY
