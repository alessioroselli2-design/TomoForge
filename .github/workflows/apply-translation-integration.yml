name: Apply multilingual translation integration

on:
  push:
    branches:
      - codex/translation-integration-auto
    paths:
      - '.github/workflows/apply-translation-integration.yml'
      - '.github/scripts/apply_translation_integration.py'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/translation-integration-auto
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Apply integration patch
        run: python .github/scripts/apply_translation_integration.py

      - name: Run focused translation tests
        run: cd backend && pytest -q tests/test_reference_translation.py tests/test_multilingual_translation_integration.py tests/test_reference_library.py
        env:
          SESSION_SECRET: tomoforge-ci-session-secret-32-bytes

      - name: Run full backend tests
        run: cd backend && pytest -q
        env:
          SESSION_SECRET: tomoforge-ci-session-secret-32-bytes

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Check whitespace errors
        run: git diff --check

      - name: Remove one-time automation
        run: rm .github/scripts/apply_translation_integration.py .github/workflows/apply-translation-integration.yml

      - name: Commit integration
        run: |
          git config user.name "tomoforge-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git commit -m "Integrate multilingual reference translation"
          git push origin HEAD:codex/translation-integration-auto
