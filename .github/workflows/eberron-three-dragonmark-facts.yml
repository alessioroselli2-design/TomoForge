name: Eberron three dragonmark facts read-only

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/eberron-three-dragonmark-facts.yml
      - backend/scripts/eberron_three_dragonmark_fields.py

permissions:
  contents: read

concurrency:
  group: tomoforge-eberron-three-mark-evidence
  cancel-in-progress: false

jobs:
  factual-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tomoforge-manuals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local source-reading dependencies
        run: |
          python -m pip install -r backend/requirements.txt boto3 PyMuPDF
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita
      - name: Verify source SHA and capture only independent factual findings
        run: python backend/scripts/eberron_three_dragonmark_fields.py --output /tmp/eberron-three-marks-facts.json
      - name: Preserve only bounded and unverified factual metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eberron-three-mark-facts-review-only
          path: /tmp/eberron-three-marks-facts.json
          if-no-files-found: warn
          retention-days: 3
