name: Expand TomoForge manual bundle in R2

on:
  workflow_dispatch:
    inputs:
      zip_key:
        description: Exact R2 object key for the uploaded ZIP
        required: true
        type: string
      delete_zip:
        description: Delete source ZIP after successful expansion
        required: false
        default: false
        type: boolean
  push:
    branches:
      - codex/r2-zip-ingest
    paths:
      - .github/r2-zip-import-request.txt

permissions:
  contents: read

concurrency:
  group: tomoforge-r2-zip-expansion
  cancel-in-progress: false

jobs:
  expand-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tomoforge-manuals

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve ZIP request
        id: request
        env:
          ZIP_INPUT: ${{ inputs.zip_key }}
          DELETE_INPUT: ${{ inputs.delete_zip }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            zip_key="$ZIP_INPUT"
            delete_zip="$DELETE_INPUT"
          elif [ -f .github/r2-zip-import-request.txt ]; then
            zip_key="$(head -n 1 .github/r2-zip-import-request.txt | tr -d '\r\n')"
            delete_zip="false"
          else
            echo "Request file removed; nothing to expand."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$zip_key" ]; then
            echo "ZIP key is empty." >&2
            exit 1
          fi
          echo "zip_key=$zip_key" >> "$GITHUB_OUTPUT"
          echo "delete_zip=$delete_zip" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.request.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install R2 dependency
        if: steps.request.outputs.skip != 'true'
        run: python -m pip install boto3

      - name: Expand uploaded ZIP into R2
        if: steps.request.outputs.skip != 'true'
        env:
          ZIP_KEY: ${{ steps.request.outputs.zip_key }}
          DELETE_ZIP: ${{ steps.request.outputs.delete_zip }}
        run: |
          args=(--zip-key "$ZIP_KEY")
          if [ "$DELETE_ZIP" = "true" ]; then
            args+=(--delete-zip)
          fi
          python backend/scripts/import_manuals_from_r2_zip.py "${args[@]}"
