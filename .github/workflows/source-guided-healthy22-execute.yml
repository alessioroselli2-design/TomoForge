name: Source-guided healthy22 execute

on:
  push:
    branches:
      - ai-canonical-library
    paths:
      - .github/source-guided-healthy22-execute-request.txt

permissions:
  contents: read

concurrency:
  group: tomoforge-source-guided-healthy22-execute
  cancel-in-progress: false

jobs:
  healthy22-execute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tomoforge-manuals

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install OCR and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt boto3

      - name: Execute sealed healthy22 source-guided repair
        run: |
          set -o pipefail
          python backend/scripts/repair_monsters_from_source.py \
            --target-set healthy22 \
            --allow-r2-download \
            --execute \
            --confirm "REPAIR-HEALTHY22-22-3c1f0be4ba3b7429694fe1a797c50870" \
            | tee /tmp/healthy22-source-guided-execute.log

      - name: Assert exact batch completion
        run: |
          grep -q '"updates_performed": 22' /tmp/healthy22-source-guided-execute.log
          grep -q '"blocked": 0' /tmp/healthy22-source-guided-execute.log
          grep -q '"targets": 22' /tmp/healthy22-source-guided-execute.log

      - name: Upload execute output
        uses: actions/upload-artifact@v4
        with:
          name: healthy22-source-guided-execute
          path: /tmp/healthy22-source-guided-execute.log
          if-no-files-found: error
          retention-days: 3
