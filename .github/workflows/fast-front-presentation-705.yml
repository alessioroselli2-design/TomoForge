name: Prepare verified static card previews
on:
  push:
    branches: ["fix/mobile-startup-session-20261128"]
    paths: [".github/workflows/fast-front-presentation-705.yml"]
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'alessioroselli2-design/TomoForge' && github.ref == 'refs/heads/fix/mobile-startup-session-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/mobile-startup-session-20261128
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Generate nine master and nine trim files from approved compositor
        run: |
          python -m pip install --only-binary=:all: Pillow==11.3.0 playwright==1.52.0
          if ! command -v google-chrome && ! command -v chromium; then python -m playwright install chromium; fi
          python frontend/scripts/buildFastFrontPresentation.py
          test "$(find frontend/public/card-art/screen-bronze-v1 -name '*.webp' | wc -l)" -eq 18
      - name: Commit screen-only assets and manifest
        run: |
          git add frontend/public/card-art/screen-bronze-v1 frontend/src/lib/fastFrontPresentation.json
          git rm .github/workflows/fast-front-presentation-705.yml
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Add verified static display master and trim assets"
          git push origin HEAD:fix/mobile-startup-session-20261128
