name: Eberron Dyrrn sealed registered-source review
on:
  push:
    branches:
      - 'audit/dyrrn-source-review-*'
    paths:
      - .github/workflows/dyrrn-source-review.yml
      - backend/services/dyrrn_source_review.py
      - backend/tests/test_dyrrn_source_review.py
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  exact-record-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Exact Italian source provenance and dice validation without writes
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "backend"))
          from core.db import db
          from services.dyrrn_source_review import (
              RECORD_ID,
              assess_dyrrn_registered_source,
          )

          async def audit():
              if not db.configured:
                  raise ValueError("source_database_unavailable")
              before = await db.private_reference_records.find_one({"id": RECORD_ID})
              reviewed = assess_dyrrn_registered_source(before)
              after = await db.private_reference_records.find_one({"id": RECORD_ID})
              if before != after:
                  raise ValueError("concurrent_source_snapshot_changed")
              return {
                  "status": reviewed["status"],
                  "source_id": reviewed["source_id"],
                  "registered_pages": reviewed["registered_pages"],
                  "original_attributes_unchanged": reviewed["original_attributes_unchanged"],
                  "numeric_gates_passed": reviewed["numeric_gates_passed"],
                  "raw_ocr_dice_is_preserved": reviewed["raw_ocr_dice_is_preserved"],
                  "snapshot_unchanged": True,
                  "writes": 0,
              }

          print("DYRRN_REGISTERED_SOURCE_FINAL_REPORT")
          print(json.dumps(asyncio.run(audit()), sort_keys=True))
          PY
      - name: Post source-only positive gate
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body "Dyrrn Eberron IT registered p289+291 exact source review passed: English original AC21 PF325 (31d8+186) speed 40ft/fly40ft, 12m converted, original source OCR 3ld8 preserved, all math gates live, no writes. Separate guarded status-only DB review and green CI/Vercel required."
          fi
