name: One-time PR 704 emblem normalization
on:
  push:
    branches: [feat/print-press-pdf-20261124]
    paths: ['.github/workflows/pr704-emblems-once.yml']
permissions:
  contents: write
jobs:
  normalize:
    if: github.ref == 'refs/heads/feat/print-press-pdf-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Install image library
        run: python3 -m pip install Pillow==11.3.0
      - name: Normalize approved assets only
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageFilter, ImageChops
          from pathlib import Path
          root=Path('frontend/public/emblemi')
          files=sorted(root.glob('classi/cls-*.png'))+sorted(root.glob('scuole/scl-*.png'))+sorted(root.glob('mostri/mst-*.webp'))+[root/'drago-originale-hd-v2.webp']
          assert len(files)==35
          for p in files:
              im=Image.open(p)
              w,h=im.size
              assert w==h and w<640
              base=im.resize((640,640),Image.Resampling.LANCZOS)
              if im.mode=='RGBA':
                  alpha=base.getchannel('A')
                  rgb=base.convert('RGB')
                  sharp=rgb.filter(ImageFilter.UnsharpMask(radius=1.25,percent=55,threshold=4))
                  interior=alpha.point(lambda x:255 if x>=250 else 0).filter(ImageFilter.MinFilter(5))
                  out=Image.composite(sharp,rgb,interior)
                  out.putalpha(alpha)
              else:
                  assert im.mode=='RGB'
                  out=base.filter(ImageFilter.UnsharpMask(radius=1.25,percent=55,threshold=4))
              if p.suffix=='.webp':
                  out.save(p,lossless=True,method=6,exact=True)
              else:
                  out.save(p,optimize=True)
              check=Image.open(p)
              assert check.size==(640,640) and check.mode==im.mode
              if im.mode=='RGBA':
                  assert ImageChops.difference(check.getchannel('A'),alpha).getbbox() is None
                  old=im.getchannel('A').point(lambda x:255 if x>=128 else 0).getbbox()
                  new=check.getchannel('A').point(lambda x:255 if x>=128 else 0).getbbox()
                  assert max(abs(a/w-b/640) for a,b in zip(old,new))<.005
          already=list(root.glob('razze/rz-*.png'))+list(root.glob('privilegi/*.png'))+list(root.glob('categorie/*.png'))
          assert len(already)==56 and all(Image.open(p).size==(640,640) for p in already)
          p=Path('frontend/src/lib/frontEmblems.js')
          s=p.read_text()
          for n in (160,280,320,384):
              for key in ('width','height','cell'):
                  s=s.replace(f'{key}:{n}',f'{key}:640')
          s=s.replace('The original approved Dragon artwork is recropped symmetrically at 160px instead of the','The approved Dragon artwork is resampled from its existing 160px file to 640px instead of the').replace('44px preview atlas. No AI substitution, no CSS upscaling of a tiny cell.','44px preview atlas. The source detail remains limited; no recrop or AI substitution.').replace('independent original transparent WebP files (280px, quality 90)','independent transparent WebP files resampled from the approved 280px sources (640px, lossless)')
          p.write_text(s)
          p=Path('frontend/src/lib/frontEmblems.test.js')
          s=p.read_text()
          for n in (160,280,320,384):
              for key in ('width','height','cell'):
                  s=s.replace(f'{key}:{n}',f'{key}:640')
          s=s.replace('individual HD file, without changing Dragon','individual 640px file, with unchanged Dragon framing')
          s=s.replace('    expect(webp.toString("ascii",8,16)).toBe("WEBPVP8X");\n    expect(webp[20]&16).toBe(16);\n    expect(webp.readUIntLE(24,3)+1).toBe(280);\n    expect(webp.readUIntLE(27,3)+1).toBe(280);','    expect(webp.toString("ascii",8,16)).toBe("WEBPVP8L");\n    expect(webp[20]).toBe(0x2f);\n    const packed=webp.readUInt32LE(21);\n    expect((packed>>>28)&1).toBe(1);\n    expect((packed&0x3fff)+1).toBe(640);\n    expect(((packed>>>14)&0x3fff)+1).toBe(640);')
          assert 'WEBPVP8X' not in s
          p.write_text(s)
          print('Verified 35 normalized images and 56 unchanged 640px assets.')
          PY
      - name: Commit on preview branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/emblemi/classi frontend/public/emblemi/scuole frontend/public/emblemi/mostri frontend/public/emblemi/drago-originale-hd-v2.webp frontend/src/lib/frontEmblems.js frontend/src/lib/frontEmblems.test.js
          git commit -m "Normalize 35 approved front emblems to 640px without recropping"
          git push origin HEAD:refs/heads/feat/print-press-pdf-20261124
