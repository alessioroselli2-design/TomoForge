name: Eberron Rak Tulkhesh sealed source review
on:
  push:
    branches:
      - 'audit/rak-tulkhesh-source-review-*'
    paths:
      - .github/workflows/rak-tulkhesh-source-review.yml
      - backend/services/rak_tulkhesh_source_review.py
      - backend/tests/test_rak_tulkhesh_source_review.py
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  exact-record-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check exact registered source snapshot and numeric gates without writes
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "backend"))
          from core.db import db
          from services.rak_tulkhesh_source_review import (
              RECORD_ID,
              assess_rak_tulkhesh_registered_source,
          )

          async def audit():
              if not db.configured:
                  raise RuntimeError("source_database_unavailable")
              first = await db.private_reference_records.find_one({"id": RECORD_ID})
              report = assess_rak_tulkhesh_registered_source(first)
              last = await db.private_reference_records.find_one({"id": RECORD_ID})
              if first != last:
                  raise RuntimeError("registered_snapshot_changed")
              return {
                  "status": report["status"],
                  "source_id": report["source_id"],
                  "registered_pages": report["pages"],
                  "original_attributes_unchanged": report["original_attributes_unchanged"],
                  "original_raw_dice_preserved": report["original_raw_dice_preserved"],
                  "numeric_gates_passed": report["numeric_gates_passed"],
                  "snapshot_unchanged": True,
                  "writes": 0,
              }

          print("RAK_TULKHESH_SOURCE_FINAL_REPORT")
          print(json.dumps(asyncio.run(audit()), sort_keys=True))
          PY
      - name: Post source-only audit verdict
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body "Rak Tulkhesh source review: registered Eberron IT p313/314 exact unchanged snapshot and original English AC23/25 ranged, PF478 (33d12+264), speed12/12/24m corroborated. Raw OCR 33dl2 preserved, original math gates active, 0 DB writes; guarded status-only promotion still requires CI/Vercel and merge."
          fi
