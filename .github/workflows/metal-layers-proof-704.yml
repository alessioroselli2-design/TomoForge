name: Build additional v25-style metal separation layers
on:
  push:
    branches: ["feat/print-press-pdf-20261124"]
    paths: [".github/workflows/metal-layers-proof-704.yml"]
permissions:
  contents: write
jobs:
  proof:
    if: github.repository == 'alessioroselli2-design/TomoForge' && github.ref == 'refs/heads/feat/print-press-pdf-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/print-press-pdf-20261124
      - name: Generate and verify eight additional transparent metal layers
        run: |
          python3 -m pip install --quiet Pillow==11.3.0 numpy==2.2.6 scipy==1.15.3
          python3 frontend/scripts/makeAllMetalSeparation.py
          test "$(find frontend/public/card-art/proofs/metal-v26 -name '*.webp' | wc -l)" -eq 8
      - name: Commit isolated proof layers, remove one-time workflow
        run: |
          git add frontend/public/card-art/proofs/metal-v26
          git rm .github/workflows/metal-layers-proof-704.yml
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Add eight verified native transparent metal separation layers"
          git push origin HEAD:feat/print-press-pdf-20261124
