name: Eberron dragonmarks private source quality audit

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/eberron-dragonmarks-source-audit.yml
      - backend/scripts/eberron_dragonmarks_source_audit.py

permissions:
  contents: read

concurrency:
  group: eberron-dragonmarks-source-audit
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: '1'
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tomoforge-manuals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install required local dependencies
        run: |
          python -m pip install -r backend/requirements.txt boto3 PyMuPDF
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita
      - name: Extract only page-level structural agreement, never source prose
        run: python backend/scripts/eberron_dragonmarks_source_audit.py --output /tmp/eberron-dragonmarks-source-quality.json
      - name: Save private-source metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eberron-dragonmarks-source-evidence-metadata
          path: /tmp/eberron-dragonmarks-source-quality.json
          if-no-files-found: warn
          retention-days: 3
